# =====================================================
# .chainlit/config.toml - Configuración de Chainlit para Eroski
# =====================================================

[project]
# Habilitar telemetría (datos anónimos de uso)
enable_telemetry = true

# Variables de entorno requeridas por usuarios
user_env = []

# Tiempo de sesión en segundos (1 hora)
session_timeout = 3600

# Habilitar caché de terceros
cache = false

# Orígenes autorizados
allow_origins = ["*"]

[features]
# Mostrar playground de prompts
prompt_playground = true

# Procesar HTML (deshabilitado por seguridad)
unsafe_allow_html = false

# Procesar expresiones matemáticas
latex = false

# Auto-tag threads con user ID
auto_tag_thread = true

# Permitir subida de archivos
multi_modal = true

# Voz a texto
speech_to_text = false

# Texto a voz
text_to_speech = false

[UI]
# Nombre de la aplicación
name = "Asistente de Incidencias Eroski"

# Mostrar README por defecto
show_readme_as_default = true

# Descripción para meta tags
description = "Chatbot inteligente para gestión de incidencias técnicas en tiendas Eroski"

# Colapsar contenido largo por defecto
default_collapse_content = true

# Expandir mensajes por defecto
default_expand_messages = false

# Ocultar chain of thought
hide_cot = false

# CSS personalizado
custom_css = "/public/eroski-theme.css"

[UI.theme]
default_mode = "light"

[UI.theme.light]
# Colores personalizados Eroski
[UI.theme.light.primary]
main = "#E31E24"
dark = "#B71C21" 
light = "#F5E6E7"

[UI.theme.dark]
[UI.theme.dark.primary]
main = "#E31E24"
dark = "#B71C21"
light = "#F5E6E7"

[meta]
generated_by = "1.0.505"